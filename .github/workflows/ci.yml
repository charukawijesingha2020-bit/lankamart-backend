name: LankaMart CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore LankaMart.sln

      - name: Build project
        run: dotnet build LankaMart.sln --no-restore

      - name: Run tests
        run: dotnet test LankaMart.sln --no-build